entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@henryopenclaw.cloud
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web
