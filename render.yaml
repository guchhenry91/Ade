services:
  - type: web
    name: sports-betting-model
    runtime: python
    rootDir: sports-betting-model
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
